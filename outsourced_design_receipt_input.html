<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외주설계발주입고</title>
<!-- v15: 사진 없음. 외주설계발주등록/현황 및 SET발주입고 패턴을 따라 직접 설계 -->
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:14px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc;display:flex;gap:6px;align-items:center}.label{font-weight:700}.field{height:27px;border:1px solid #b7c2cb;background:#fff;padding:0 7px;outline:none}.field:focus{border-color:#4e88bb}
.top{flex:1.1;min-height:0;padding:7px 14px 0;display:flex}.top .box{flex:1}
.bottom{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.6fr;gap:6px;padding:6px 14px}.formgrid{display:grid;grid-template-columns:90px 1fr 90px 1fr;gap:5px;padding:8px;align-content:start}.formgrid .label{height:27px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:#eef3f7}.formgrid .field{width:100%}.formgrid .wide{grid-column:2/5}.bar{height:8px;background:#e1e8ee;border:1px solid #c5ced6}.bar i{display:block;height:100%;background:#3f87c4}
.box{border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}.box-title{height:24px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#deebf5,#caddea);border-bottom:1px solid var(--line);font-weight:700;color:#536677}
.searchbar{height:26px;display:flex;gap:4px;align-items:center;padding:0 4px;border-bottom:1px solid var(--line2);background:#f6f8fa}.searchbar input{flex:1;height:21px;border:1px solid #b7c2cb;padding:0 4px}.searchbar button{height:21px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#e2e8ed)}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{height:24px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
.movebar{display:flex;justify-content:flex-end;gap:6px;padding:0 14px}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
input.cell{width:100%;height:20px;border:1px solid #cbd4dc;padding:0 3px;text-align:right}
@media(max-width:900px){.top,.bottom{grid-template-columns:1fr;height:auto}.title h1{font-size:18px}}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:880px){.formgrid{grid-template-columns:90px minmax(0,1fr)}}
.formgrid>*{min-width:0}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>외주설계발주입고</h1><div class="plant"><span>공장</span><select id="plant" class="field"><option>1공장</option><option>2공장</option></select></div></div>
  <section class="filters">
    <span class="label">발주일</span><input id="fromQ" class="field" type="date" value="2025-01-01"><span>~</span><input id="toQ" class="field" type="date" value="2026-12-31">
    <span class="label">협력업체</span><select id="venQ" class="field"><option value="">전체</option></select>
    <span class="label">제 번</span><input id="jobQ" class="field" style="width:160px" placeholder="제번/품명">
    <label><input type="checkbox" id="onlyOpen" checked> 미입고만</label>
    <button class="btn" onclick="search()">⌕ 조회</button>
  </section>
  <section class="top">
    <div class="box"><div class="box-title">외주설계 발주 리스트 (입고 대상)</div><div class="tablewrap"><table>
      <colgroup><col style="width:36px"><col style="width:36px"><col style="width:11%"><col style="width:14%"><col style="width:12%"><col style="width:6%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:12%"><col style="width:9%"><col style="width:7%"></colgroup>
      <thead><tr><th>No</th><th></th><th>제번</th><th>품명</th><th>협력업체</th><th>공정</th><th>발주일</th><th>입고예정</th><th>네고가</th><th>진척률</th><th>입고일</th><th>상태</th></tr></thead>
      <tbody id="ordBody"></tbody></table></div></div>
  </section>
  <section class="bottom">
    <div class="box"><div class="box-title">입고 등록</div>
      <div class="formgrid">
        <div class="label">제번</div><input id="fJob" class="field" readonly><div class="label">공정</div><input id="fProc" class="field" readonly>
        <div class="label">협력업체</div><input id="fVen" class="field" readonly><div class="label">네고가</div><input id="fNego" class="field r" readonly>
        <div class="label">입고일</div><input id="fDate" class="field" type="date"><div class="label">진척률(%)</div><input id="fRate" class="field r" type="number" min="0" max="100" step="5" value="100">
        <div class="label">입고금액</div><input id="fAmt" class="field r" type="number" min="0"><div class="label">검수자</div><input id="fInsp" class="field" value="권태윤">
        <div class="label">비고</div><input id="fRemark" class="wide field" placeholder="도면/3D데이터 접수 내용">
      </div></div>
    <div class="box"><div class="box-title">입고 이력</div><div class="tablewrap"><table>
      <colgroup><col style="width:36px"><col style="width:36px"><col style="width:15%"><col style="width:8%"><col style="width:16%"><col style="width:13%"><col style="width:9%"><col style="width:13%"><col style="width:10%"><col></colgroup>
      <thead><tr><th>No</th><th></th><th>제번</th><th>공정</th><th>협력업체</th><th>입고일</th><th>진척</th><th>입고금액</th><th>검수자</th><th>비고</th></tr></thead>
      <tbody id="rcpBody"></tbody></table></div></div>
  </section>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn primary" onclick="receive()">▣ 입고처리</button><button class="btn" onclick="cancelReceipt()">↶ 입고취소</button><button class="btn" onclick="exportCsv()">▤ EXCEL</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">입고할 발주를 선택한 뒤 입고일·진척률을 입력하고 입고처리 하세요.</span><span class="right" id="countText"></span></footer>
</div>
<script>
let ORD=[],RCP=[],view=[],sel=-1;
const money=v=>Number(v||0).toLocaleString('ko-KR');
const today=()=>new Date().toISOString().slice(0,10);
function rows(d){return Array.isArray(d)?d:(d.rows||[])}
function statusOf(o){return o.progress_rate>=100?'입고완료':o.progress_rate>0?'부분입고':(o.expected_date&&o.expected_date<today()?'지연':'대기')}
function renderOrd(){ordBody.innerHTML=view.map((o,i)=>`<tr class="${i===sel?'sel':''}" onclick="pick(${i})"><td class="c">${i+1}</td><td class="c">${i===sel?'▶':''}</td><td>${o.job_no}</td><td>${o.item_name}</td><td>${o.partner_name}</td><td class="c">${o.process_code}</td><td class="c">${o.order_date||''}</td><td class="c">${o.expected_date||''}</td><td class="r">${money(o.nego_price)}</td><td><div class="bar"><i style="width:${o.progress_rate}%"></i></div><small>${o.progress_rate}%</small></td><td class="c">${o.receipt_date||''}</td><td class="c">${statusOf(o)}</td></tr>`).join('');countText.textContent=`발주 ${view.length}건 / 입고이력 ${RCP.length}건`}
function renderRcp(){const list=sel>=0?RCP.filter(r=>r.order_seq===view[sel].seq):RCP;rcpBody.innerHTML=list.map((r,i)=>`<tr><td class="c">${i+1}</td><td class="c"><input type="checkbox" data-no="${r.receipt_no}"></td><td>${r.job_no}</td><td class="c">${r.process_code}</td><td>${r.partner_name}</td><td class="c">${r.receipt_date}</td><td class="c">${r.progress_rate}%</td><td class="r">${money(r.amount)}</td><td class="c">${r.inspector}</td><td>${r.remark||''}</td></tr>`).join('')}
function pick(i){sel=i;const o=view[i];fJob.value=o.job_no;fProc.value=o.process_code;fVen.value=o.partner_name;fNego.value=money(o.nego_price);fDate.value=today();fRate.value=100;const done=RCP.filter(r=>r.order_seq===o.seq).reduce((s,r)=>s+r.amount,0);fAmt.value=Math.max(0,(o.nego_price||0)-done);renderOrd();renderRcp();msg(`${o.job_no} ${o.process_code} (${o.partner_name}) 선택 - 현재 진척 ${o.progress_rate}%`)}
function search(){const f=fromQ.value,t=toQ.value,v=venQ.value,q=jobQ.value.trim().toLowerCase(),open=onlyOpen.checked;view=ORD.filter(o=>(!f||o.order_date>=f)&&(!t||o.order_date<=t)&&(!v||o.partner_name===v)&&(!q||o.job_no.toLowerCase().includes(q)||(o.item_name||'').toLowerCase().includes(q))&&(!open||o.progress_rate<100));sel=-1;renderOrd();renderRcp();msg(`발주 ${view.length}건을 조회했습니다.`)}
async function receive(){if(sel<0)return msg('입고할 발주를 선택하세요.');const o=view[sel];if(o.progress_rate>=100)return msg('이미 입고완료된 발주입니다.');const rate=Number(fRate.value),amt=Number(fAmt.value)||0;if(!fDate.value)return msg('입고일을 입력하세요.');if(!(rate>o.progress_rate&&rate<=100))return msg(`진척률은 현재값(${o.progress_rate}%)보다 크고 100 이하여야 합니다.`);if(fDate.value<o.order_date)return msg('입고일이 발주일보다 빠를 수 없습니다.');const done=RCP.filter(r=>r.order_seq===o.seq).reduce((s,r)=>s+r.amount,0);if(done+amt>(o.nego_price||0)&&!confirm('입고금액 누계가 네고가를 초과합니다. 계속하시겠습니까?'))return;/* v39: 입고이력을 outsourced_design_receipts 에 실제 저장 (기존엔 메모리에만 남아 새로고침 시 유실) */
 const rec={receipt_no:RCP.length?Math.max(...RCP.map(r=>Number(r.receipt_no)||0))+1:1,
  order_seq:o.seq,job_no:o.job_no,partner_name:o.partner_name,process_code:o.process_code,
  receipt_date:fDate.value,progress_rate:rate,amount:amt,
  inspector:fInsp.value||null,remark:fRemark.value||null};
 if(window.MESDB&&MESDB.online){
  try{
   /* v39: receipt_no 는 DB identity 가 채운다 */
   delete rec.receipt_no;
   const ins=await MESDB.table('outsourced_design_receipts').insertOne(rec);
   rec.receipt_no=(ins&&ins.receipt_no)||(RCP.length?Math.max(...RCP.map(r=>Number(r.receipt_no)||0))+1:1);
   /* order_lines 의 진척률·입고일 반영 (제조원가의 외주설계비 산정 기준) */
   /* v39: 외주설계는 별도 입고확정 화면이 없다. 진척 100% + 검수자 입력 = 입고확정으로 처리해야
      제조원가(입고확정 건만 집계)에 외주설계비가 잡힌다. */
   await MESDB.table('order_lines').upsert({line_id:o.seq,nego_rate:rate,
     receipt_date:rate>=100?fDate.value:null,
     confirm_date:rate>=100?fDate.value:null,
     status:rate>=100?'입고확정':'발주',
     updated_at:new Date().toISOString()},'line_id');
  }catch(e){return msg('입고 저장 실패: '+String(e.message||e).slice(0,130))}
 }
 RCP.push(rec);o.progress_rate=rate;if(rate>=100)o.receipt_date=fDate.value;fRemark.value='';
 const okmsg=`${o.job_no} ${rate>=100?'입고완료(확정)':'부분입고 '+rate+'%'} 처리했습니다.${(window.MESDB&&MESDB.online)?' (DB 반영)':' (DB 미연결 - 로컬)'}`;
 if(onlyOpen.checked&&rate>=100){search();msg(okmsg+' 미입고 목록에서 제외되었습니다.')}
 else{renderOrd();renderRcp();msg(okmsg)}}
async function cancelReceipt(){const ids=[...rcpBody.querySelectorAll('input:checked')].map(x=>Number(x.dataset.no));if(!ids.length)return msg('취소할 입고 이력을 선택하세요.');if(!confirm(`${ids.length}건의 입고를 취소하시겠습니까?`))return;
 if(window.MESDB&&MESDB.online){try{for(const id of ids)await MESDB.table('outsourced_design_receipts').delete({receipt_no:id})}catch(e){return msg('입고취소 실패: '+String(e.message||e).slice(0,130))}}for(let i=RCP.length-1;i>=0;i--)if(ids.includes(RCP[i].receipt_no)){const r=RCP.splice(i,1)[0];const o=ORD.find(x=>x.seq===r.order_seq);if(o){const rest=RCP.filter(x=>x.order_seq===o.seq);o.progress_rate=rest.length?Math.max(...rest.map(x=>Number(x.progress_rate)||0)):0;o.receipt_date=o.progress_rate>=100?o.receipt_date:null;
  if(window.MESDB&&MESDB.online){try{await MESDB.table('order_lines').upsert({line_id:o.seq,nego_rate:o.progress_rate,receipt_date:o.receipt_date||null,confirm_date:o.progress_rate>=100?o.receipt_date:null,status:o.progress_rate>=100?'입고확정':'발주',updated_at:new Date().toISOString()},'line_id')}catch(e){}}}}search();msg(`${ids.length}건 입고를 취소했습니다.`)}
function exportCsv(){const out=[['제번','공정','협력업체','입고일','진척률','입고금액','검수자','비고'],...RCP.map(r=>[r.job_no,r.process_code,r.partner_name,r.receipt_date,r.progress_rate,r.amount,r.inspector,r.remark||''])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='outsourced_design_receipts.csv';a.click();URL.revokeObjectURL(a.href)}
function msg(t){message.textContent=t}
const FALLBACK_ORD=[];
const FALLBACK_RCP=[];
async function load(){
 /* v39: 거래이력 초기화 상태에서 샘플이 남지 않도록 빈 배열로 시작 */
 ORD=[];RCP=[];
 for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
 if(window.MESDB&&MESDB.online){
  try{RCP=await MESDB.table('outsourced_design_receipts').select('select=*&order=receipt_no')}catch(e){}
 }
[...new Set(ORD.map(o=>o.partner_name))].sort().forEach(v=>venQ.insertAdjacentHTML('beforeend',`<option>${v}</option>`));search()}
load();window.MES={search,save:receive,exportCsv,setMessage:msg};
</script>
<script src="mes_db.js?v=41"></script>
<script>MESDB.lines({page:"outsourced_design_receipt_input",category:"외주설계",statuses:[],map:{"seq": {"col": "line_id", "type": "num"}, "job_no": "job_no", "item_name": "item_name", "partner_name": "vendor_name", "process_code": "process_code", "order_date": {"col": "order_date", "type": "date"}, "expected_date": {"col": "required_date", "type": "date"}, "nego_price": {"col": "confirm_price", "type": "num"}, "progress_rate": {"col": "nego_rate", "type": "num"}, "receipt_date": {"col": "receipt_date", "type": "date"}},get:()=>ORD,render:()=>search()});</script>
<script src="mes_ctx.js?v=41"></script>
</body>
</html>
