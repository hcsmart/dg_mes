<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외주가공 입고</title>
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:14px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.label{font-weight:700}.field{height:27px;border:1px solid #b7c2cb;background:#fff;padding:0 7px;outline:none}.field:focus{border-color:#4e88bb}
.box{margin:7px 14px 0;border:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}.box.grow{flex:1}
.box-title{height:25px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#deebf5,#caddea);border-bottom:1px solid var(--line);font-weight:700;color:#536677}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;min-width:1260px;width:100%;table-layout:fixed}th,td{height:25px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
.movebar{display:flex;align-items:center;gap:6px;padding:6px 14px;justify-content:flex-end}
.cancelbar{padding:0 14px 4px}
.applybar{height:38px;margin:0 14px;display:flex;align-items:center;gap:7px;justify-content:flex-end}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}.btn.warn{color:#a63a2f}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
.empty{padding:14px;text-align:center;color:#8b98a4}
@media(max-width:900px){.title h1{font-size:18px}}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>외주가공 입고</h1><div class="plant"><span>공장</span><select id="plant" class="field"><option>1공장</option><option>2공장</option></select></div></div>
  <section class="filters">
    <span class="label">협력업체</span><input id="vendorQ" class="field" style="width:170px">
    <span class="label">제 번</span><input id="jobQ" class="field" style="width:170px">
    <span class="label">품명</span><input id="itemQ" class="field" style="width:170px">
    <span class="label">공정</span><select id="procQ" class="field" style="width:70px"><option value=""></option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option></select>
    <span class="label">품번</span><input id="partQ" class="field" style="width:110px">
    <button class="btn" onclick="search()">⌕ 조회</button>
  </section>
  <div class="box grow"><div class="box-title">입고 처리 대기 리스트</div><div class="tablewrap"><table>
    <colgroup><col style="width:44px"><col style="width:38px"><col style="width:110px"><col style="width:130px"><col style="width:50px"><col style="width:60px"><col style="width:80px"><col style="width:150px"><col style="width:100px"><col style="width:120px"><col style="width:110px"><col style="width:92px"><col style="width:92px"></colgroup>
    <thead><tr><th>No</th><th>선택</th><th>제번</th><th>품명</th><th>공정</th><th>공정명</th><th>품번</th><th>부품명</th><th>가공공정코드</th><th>가공공정명</th><th>협력업체</th><th>발주월</th><th>입고예정일</th></tr></thead>
    <tbody id="waitBody"></tbody></table></div></div>
  <div class="movebar"><button class="btn" onclick="pushDown()">⬇ 입고등록</button><button class="btn" onclick="pullUp()">⬆ 입고제외</button></div>
  <div class="cancelbar"><button class="btn warn" onclick="cancelOrder()">✖ 발주취소</button></div>
  <div class="box grow"><div class="box-title">입고 리스트</div><div class="tablewrap"><table>
    <colgroup><col style="width:44px"><col style="width:38px"><col style="width:110px"><col style="width:50px"><col style="width:80px"><col style="width:150px"><col style="width:100px"><col style="width:120px"><col style="width:110px"><col style="width:92px"><col style="width:90px"></colgroup>
    <thead><tr><th>No</th><th>선택</th><th>제번</th><th>공정</th><th>품번</th><th>부품명</th><th>가공공정코드</th><th>가공공정명</th><th>협력업체</th><th>입고일</th><th>비고</th></tr></thead>
    <tbody id="inBody"></tbody></table></div></div>
  <div class="applybar"><span class="label">입고일</span><input id="inDate" class="field" type="date"><button class="btn primary" onclick="applyDate()">적용</button></div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▣ 저장</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫 기</button><span class="msg" id="message">협력업체·제번으로 조회하면 입고 처리 대기 자료가 표시됩니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
const rows=[
{no:1,job:'A26026',item:'',proc:'A',procName:'1/2',part:'T99A1',partName:'MACHINERY ...',mp:'MS',mpName:'성형밀링(소형)',vendor:'가강텍',odate:'2026-06-02',edate:'2026-05-22'},
{no:2,job:'A26026',item:'',proc:'A',procName:'1/2',part:'T99Y',partName:'MACHINERY ...',mp:'WS',mpName:'WIRE CUT',vendor:'동빛테크',odate:'2026-04-20',edate:'2026-04-18'},
{no:3,job:'C25120',item:'STIFFENER',proc:'B',procName:'2/6',part:'B21AY2',partName:'PUNCH, NOTC...',mp:'WS',mpName:'WIRE CUT',vendor:'동빛테크',odate:'2026-04-16',edate:'2026-04-02'},
{no:4,job:'U26088',item:'Side Cbinet(L/R)',proc:'A',procName:'1/5',part:'B16F',partName:'DIE',mp:'WS',mpName:'WIRE CUT',vendor:'동빛테크',odate:'2026-08-20',edate:'2026-08-20'},
{no:5,job:'U26048-U001',item:'Bottom Bracket LH',proc:'D',procName:'4/4',part:'B22B',partName:'PUNCH, BEND...',mp:'GS',mpName:'성형연삭(소형)',vendor:'동우정밀',odate:'2026-07-21',edate:'2026-07-21'}];
let view=[],IN=[];
function renderWait(){waitBody.innerHTML=view.length?view.map((r,i)=>`<tr onclick="pick(event,'wait',${r.no})"><td class="c">${i+1}</td><td class="c"><input type="checkbox" data-no="${r.no}"></td><td>${r.job}</td><td>${r.item}</td><td class="c">${r.proc}</td><td class="c">${r.procName}</td><td>${r.part}</td><td>${r.partName}</td><td class="c">${r.mp}</td><td>${r.mpName}</td><td>${r.vendor}</td><td class="c">${r.odate}</td><td class="c">${r.edate}</td></tr>`).join(''):'<tr><td colspan="13" class="empty">조회된 자료가 없습니다.</td></tr>';countText.textContent=`대기 ${view.length}건 / 입고 ${IN.length}건`}
function renderIn(){inBody.innerHTML=IN.length?IN.map((r,i)=>`<tr onclick="pick(event,'in',${r.no})"><td class="c">${i+1}</td><td class="c"><input type="checkbox" data-no="${r.no}"></td><td>${r.job}</td><td class="c">${r.proc}</td><td>${r.part}</td><td>${r.partName}</td><td class="c">${r.mp}</td><td>${r.mpName}</td><td>${r.vendor}</td><td class="c">${r.idate}</td><td>${r.remark||''}</td></tr>`).join(''):'<tr><td colspan="11" class="empty">입고 등록된 자료가 없습니다.</td></tr>';countText.textContent=`대기 ${view.length}건 / 입고 ${IN.length}건`}
function pick(e,which,no){if(e.target.tagName==='INPUT')return;const box=which==='wait'?waitBody:inBody;const cb=box.querySelector(`input[data-no="${no}"]`);if(cb)cb.checked=!cb.checked}
function search(){const v=vendorQ.value.trim().toLowerCase(),j=jobQ.value.trim().toLowerCase(),it=itemQ.value.trim().toLowerCase(),p=procQ.value,pt=partQ.value.trim().toLowerCase();
view=rows.filter(r=>!IN.some(x=>x.no===r.no)&&(!v||r.vendor.toLowerCase().includes(v))&&(!j||r.job.toLowerCase().includes(j))&&(!it||(r.item||'').toLowerCase().includes(it))&&(!p||r.proc===p)&&(!pt||r.part.toLowerCase().includes(pt)));
renderWait();msg(`입고 처리 대기 ${view.length}건을 조회했습니다.`)}
function pushDown(){const ids=[...waitBody.querySelectorAll('input:checked')].map(x=>Number(x.dataset.no));if(!ids.length)return msg('입고할 행을 선택하세요.');const d=inDate.value||new Date().toISOString().slice(0,10);
ids.forEach(id=>{const r=rows.find(x=>x.no===id);if(r&&!IN.some(x=>x.no===id))IN.push({...r,idate:d,remark:''})});
view=view.filter(r=>!ids.includes(r.no));renderWait();renderIn();msg(`${ids.length}건을 입고 리스트로 이동했습니다.`)}
function pullUp(){const ids=[...inBody.querySelectorAll('input:checked')].map(x=>Number(x.dataset.no));if(!ids.length)return msg('입고 제외할 행을 선택하세요.');for(let i=IN.length-1;i>=0;i--)if(ids.includes(IN[i].no))IN.splice(i,1);search();renderIn();msg(`${ids.length}건을 입고 리스트에서 제외했습니다.`)}
function cancelOrder(){const ids=[...waitBody.querySelectorAll('input:checked')].map(x=>Number(x.dataset.no));if(!ids.length)return msg('발주취소할 행을 선택하세요.');for(let i=rows.length-1;i>=0;i--)if(ids.includes(rows[i].no))rows.splice(i,1);view=view.filter(r=>!ids.includes(r.no));renderWait();msg(`${ids.length}건의 발주를 취소했습니다.`)}
function applyDate(){const d=inDate.value||new Date().toISOString().slice(0,10);if(!IN.length)return msg('입고 리스트가 비어 있습니다.');IN.forEach(r=>r.idate=d);renderIn();msg(`입고 리스트 ${IN.length}건의 입고일을 ${d}로 적용했습니다.`)}
async function save(){if(!IN.length)return msg('저장할 입고 자료가 없습니다.');if(!window.MESDB||!MESDB.online){msg(`외주가공 입고 ${IN.length}건을 저장했습니다. (DB 미연결 - 로컬)`);return}try{await MESDB.table('order_lines').upsert(IN.map(r=>({line_id:r.no,status:'입고',receipt_date:r.idate||null,updated_at:new Date().toISOString()})),'line_id');for(let i=rows.length-1;i>=0;i--)if(IN.some(x=>x.no===rows[i].no))rows.splice(i,1);IN.length=0;search();renderIn();msg('외주가공 입고를 DB에 반영했습니다. 입고확정 화면에서 확정하세요.')}catch(e){msg('DB 반영 실패: '+e.message.slice(0,120))}}
function exportCsv(){const out=[['제번','공정','품번','부품명','가공공정코드','가공공정명','협력업체','입고일'],...IN.map(r=>[r.job,r.proc,r.part,r.partName,r.mp,r.mpName,r.vendor,r.idate])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='outsourcing_receipt_input.csv';a.click();URL.revokeObjectURL(a.href)}
function msg(t){message.textContent=t}
inDate.value='2026-08-22';renderWait();renderIn();window.MES={search,save,exportCsv,setMessage:msg};
</script>
<script src="mes_db.js?v=25"></script>
<script>MESDB.lines({page:"outsourcing_receipt_input",category:"외주가공",statuses:["발주"],map:{"no": {"col": "line_id", "type": "num"}, "vendor": "vendor_name", "job": "job_no", "item": "item_name", "proc": "process_code", "procName": "process_name", "part": "part_no", "partName": "part_name", "mp": "machining_process_code", "mpName": "material", "odate": {"col": "order_date", "type": "date"}, "edate": {"col": "required_date", "type": "date"}},get:()=>rows,render:()=>{view=[...rows];render()}});</script>
</body>
</html>
