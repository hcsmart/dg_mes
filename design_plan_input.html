<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설계계획등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.fr{display:grid;gap:5px;align-items:center}
.lb{font-weight:700;text-align:right;padding-right:3px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.gtot td{background:#dfe9f2;font-weight:700}
.grp th{background:linear-gradient(#dbe9f5,#b9d2e6)}
.panes{flex:1;min-height:0;display:grid;gap:8px;padding:0 14px 8px}
.pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.pb{flex:1;min-height:0;overflow:auto}
.f2{display:grid;grid-template-columns:repeat(4,72px minmax(110px,1fr));gap:5px;align-items:center}

.mask.on{display:flex}
.dlg{margin-top:40px;width:min(1000px,96vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dh button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer}
.db{padding:10px}
.kv{display:grid;grid-template-columns:repeat(4,84px minmax(90px,1fr));gap:4px;align-items:center;margin-bottom:8px}
.kv .lb{text-align:right}
.kv .v{border:1px solid #c3ccd4;background:#fff;height:26px;line-height:24px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:14px;background:#3f7fbf;border-radius:2px}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
</style></head><body><div class="screen"><div class="title"><h1>설계계획등록</h1><small>설계관리 · 1공장</small></div><section class="filt"><div class="f2"><div class="lb">제 번</div><div><input id="q_job" class="field"></div><div class="lb">품 명</div><div><input id="q_item" class="field"></div><div class="lb">공 장</div><div><select class="field"><option>1공장</option></select></div><div></div><div></div></div></section><div class="panes" style="grid-template-rows:1.2fr 1fr"><div class="pane"><div class="ph">제번리스트</div><div class="pb"><table style="min-width:900px"><thead><tr><th style="width:140px">제번</th><th style="width:200px">품명</th><th style="width:170px">고객사</th><th style="width:120px">설계완료 예정일</th><th style="width:110px">S1</th><th>고객요구일</th></tr></thead><tbody id="hbody"></tbody></table></div></div><div class="panes" style="grid-template-columns:1fr 1.3fr;grid-template-rows:1fr;padding:0;gap:8px"><div class="pane"><div class="ph">조수 리스트</div><div class="pb"><table style="min-width:0"><thead><tr><th style="width:110px">공정코드</th><th>공정명</th><th style="width:100px">담당자</th></tr></thead><tbody id="sbody"></tbody></table></div></div><div class="pane"><div class="ph">세부공정 리스트</div><div class="pb"><table style="min-width:640px"><thead><tr><th style="width:90px">공정코드</th><th style="width:80px">공정명</th><th style="width:110px">가공공정코드</th><th style="width:130px">가공공정명</th><th>완료 예정일</th></tr></thead><tbody id="dbody"></tbody></table></div></div></div></div><div style="display:flex;gap:4px;padding:6px;align-items:center;flex-wrap:wrap;border-top:1px solid #c3ccd4;background:#f4f8fb"><span class="lb">설계완료예정일</span><input id="fPlanDate" class="field" type="date" style="width:140px"><span class="lb">설계담당</span><input id="fManager" class="field" style="width:90px"><span class="lb">공정</span><input id="fProc" class="field" style="width:56px" value="A"><input id="fProcName" class="field" style="width:70px" value="1/1"><span class="lb">가공공정</span><input id="fMach" class="field" style="width:70px" placeholder="DA"><input id="fMachName" class="field" style="width:90px" placeholder="레이아웃"><button class="btn" onclick="addStep()">＋ 세부공정</button><button class="btn" onclick="delStep()">－ 세부공정</button></div><footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">사진에서 판독한 8건을 표시했습니다.</span><span class="right" id="countText"></span></footer></div><script>const heads=[{"row_no": 1, "job_no": "A25032", "item_name": null, "customer_name": null, "design_completion_planned_date": "2025-02-23", "s1_date": "2025-03-02", "customer_request_date": "2025-03-02", "plant_name": "1공장"}, {"row_no": 2, "job_no": "A26026", "item_name": null, "customer_name": null, "design_completion_planned_date": "2026-05-01", "s1_date": "2026-12-31", "customer_request_date": "2026-12-31", "plant_name": "1공장"}, {"row_no": 3, "job_no": "C14213-S030", "item_name": "BUSBAR", "customer_name": null, "design_completion_planned_date": "2025-07-28", "s1_date": "2026-08-30", "customer_request_date": "2026-08-30", "plant_name": "1공장"}, {"row_no": 4, "job_no": "C23130-U001", "item_name": "RETAINER PA RHD", "customer_name": null, "design_completion_planned_date": "2024-10-30", "s1_date": "2024-11-15", "customer_request_date": "2024-11-15", "plant_name": "1공장"}, {"row_no": 5, "job_no": "C23140-U001", "item_name": "RETAINER DR RHD", "customer_name": null, "design_completion_planned_date": "2024-12-07", "s1_date": "2024-12-10", "customer_request_date": "2024-12-10", "plant_name": "1공장"}, {"row_no": 6, "job_no": "C23144-U001", "item_name": "MOTOR BRACKET", "customer_name": null, "design_completion_planned_date": "2024-05-09", "s1_date": "2024-05-15", "customer_request_date": "2024-05-15", "plant_name": "1공장"}, {"row_no": 7, "job_no": "C24028-A001", "item_name": "MOTOR BRACKET", "customer_name": null, "design_completion_planned_date": "2025-05-20", "s1_date": "2025-05-25", "customer_request_date": "2025-05-25", "plant_name": "1공장"}, {"row_no": 8, "job_no": "C24028-U001", "item_name": "MOTOR BRACKET", "customer_name": null, "design_completion_planned_date": "2024-09-01", "s1_date": "2024-09-15", "customer_request_date": "2024-09-15", "plant_name": "1공장"}];const steps=[{"row_no": 1, "job_no": "C23130-U001", "process_code": "A", "process_name": "1/1", "manager_name": null, "machining_process_code": "DA", "machining_process_name": "레이아웃", "completion_planned_date": null}, {"row_no": 2, "job_no": "C23130-U001", "process_code": "A", "process_name": "1/1", "manager_name": null, "machining_process_code": "DL", "machining_process_name": "조립도", "completion_planned_date": null}, {"row_no": 3, "job_no": "C23130-U001", "process_code": "A", "process_name": "1/1", "manager_name": null, "machining_process_code": "DP", "machining_process_name": "부품도", "completion_planned_date": null}];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'':Number(v).toLocaleString();const p=v=>v==null?'':Number(v).toFixed(2)+'%';
const msg=t=>message.textContent=t;
let view=[...heads];
function render(){hbody.innerHTML=view.map((r,i)=>`<tr onclick="pick(${i},this)"><td>${esc(r.job_no)}</td><td>${esc(r.item_name||'')}</td><td>${esc(r.customer_name||'')}</td><td class="c">${esc(r.design_completion_planned_date||'')}</td><td class="c">${esc(r.s1_date||'')}</td><td class="c">${esc(r.customer_request_date||'')}</td></tr>`).join('');countText.textContent=view.length+'건';}
function pick(i,tr){const r=view[i];sel=r;if(typeof fPlanDate!=='undefined')fPlanDate.value=r.design_completion_planned_date||'';document.querySelectorAll('#hbody tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');
 const rs=steps.filter(s=>s.job_no===r.job_no);
 const seen=new Set();
 sbody.innerHTML=rs.filter(s=>!seen.has(s.process_code)&&seen.add(s.process_code)).map(s=>`<tr><td>${esc(s.process_code)}</td><td>${esc(s.process_name||'')}</td><td>${esc(s.manager_name||'')}</td></tr>`).join('')||'<tr><td colspan="3" class="c" style="height:60px;color:#8a97a2">-</td></tr>';
 dbody.innerHTML=rs.length?rs.map(s=>`<tr><td>${esc(s.process_code)}</td><td>${esc(s.process_name||'')}</td><td>${esc(s.machining_process_code||'')}</td><td>${esc(s.machining_process_name||'')}</td><td class="c">${esc(s.completion_planned_date||'')}</td></tr>`).join('')
  :'<tr><td colspan="5" class="c" style="height:60px;color:#8a97a2">사진에서 판독 가능한 세부공정이 없습니다.</td></tr>';
 msg(`${r.job_no} · 세부공정 ${rs.length}건`);}
function search(){const j=q_job.value.trim().toLowerCase(),it=q_item.value.trim().toLowerCase();
 view=heads.filter(r=>(!j||r.job_no.toLowerCase().includes(j))&&(!it||String(r.item_name??'').toLowerCase().includes(it)));sbody.innerHTML='';dbody.innerHTML='';render();msg(`조회결과 ${view.length}건입니다.`);}
/* v30: 설계계획을 design_plans / design_plan_steps 에 실제 저장 + job_pool 연동 */
let sel=null;
const online=()=>!!(window.MESDB&&MESDB.online);
async function waitDB(){for(let i=0;i<60&&!window.MESDB;i++)await new Promise(r=>setTimeout(r,50));
 if(window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}}

async function loadPool(){
 await waitDB();if(!online())return;
 try{
  const pool=await MESDB.table('job_pool').select('select=*&order=row_no');
  const seen=new Set(heads.map(h=>h.job_no));
  pool.forEach(r=>{if(!seen.has(r.job_no))heads.push({row_no:null,job_no:r.job_no,item_name:r.item_name,
    customer_name:r.customer_name,design_completion_planned_date:null,
    s1_date:r.s1_date,customer_request_date:r.customer_request_date,plant_name:r.plant_name,_new:true})});
  view=[...heads];render();
  msg(`제번 ${heads.length}건 (계획수립 ${heads.filter(h=>!h._new).length} / 미수립 ${heads.filter(h=>h._new).length})`);
 }catch(e){}
}
async function reloadSteps(job){
 if(!online())return;
 try{const rs=await MESDB.table('design_plan_steps').select(`select=*&job_no=eq.${encodeURIComponent(job)}&order=row_no`);
  for(let i=steps.length-1;i>=0;i--)if(steps[i].job_no===job)steps.splice(i,1);
  steps.push(...rs);
  const tr=[...document.querySelectorAll('#hbody tr')][view.findIndex(v=>v.job_no===job)];
  if(tr)pick(view.findIndex(v=>v.job_no===job),tr);
 }catch(e){}
}
async function save(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(!online()){msg(`${sel.job_no} 설계계획을 저장했습니다. (DB 미연결 - 로컬)`);return}
 try{
  let rowNo=sel.row_no;
  if(rowNo==null){const mx=await MESDB.table('design_plans').select('select=row_no&order=row_no.desc&limit=1');
   rowNo=(mx&&mx[0]?Number(mx[0].row_no):0)+1}
  const o={row_no:Number(rowNo),job_no:sel.job_no,item_name:sel.item_name,customer_name:sel.customer_name,
   design_completion_planned_date:fPlanDate.value||sel.design_completion_planned_date||null,
   s1_date:sel.s1_date||null,customer_request_date:sel.customer_request_date||null,
   plant_name:sel.plant_name||'1공장'};
  await MESDB.table('design_plans').upsert(o,'job_no');
  sel.row_no=o.row_no;sel._new=false;
  sel.design_completion_planned_date=o.design_completion_planned_date;
  render();
  msg(`${sel.job_no} 설계계획을 저장했습니다. (설계완료예정 ${o.design_completion_planned_date||'-'})`);
 }catch(e){const m=String(e.message||e);
  msg(/무결성|foreign key/i.test(m)?'저장 실패: 등록되지 않은 제번입니다.':'저장 실패: '+m.slice(0,120))}
}
async function addStep(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(sel._new){msg('먼저 「저장」으로 설계계획을 등록하세요.');return}
 if(!online()){msg('DB 미연결 상태에서는 세부공정을 추가할 수 없습니다.');return}
 const proc=(fProc.value||'').trim();if(!proc){msg('공정코드를 입력하세요.');return}
 try{
  const mx=await MESDB.table('design_plan_steps').select('select=row_no&order=row_no.desc&limit=1');
  await MESDB.table('design_plan_steps').upsert({row_no:(mx&&mx[0]?Number(mx[0].row_no):0)+1,
   job_no:sel.job_no,process_code:proc,process_name:(fProcName.value||'1/1').trim(),
   manager_name:fManager.value||null,machining_process_code:fMach.value||null,
   machining_process_name:fMachName.value||null,
   completion_planned_date:fPlanDate.value||null},'row_no');
  await reloadSteps(sel.job_no);
  msg(`${sel.job_no} 세부공정 ${proc} 을(를) 추가했습니다.`);
 }catch(e){msg('추가 실패: '+String(e.message||e).slice(0,120))}
}
async function delStep(){
 if(!sel){msg('제번을 선택하세요.');return}
 const rs=steps.filter(s=>s.job_no===sel.job_no&&s.process_code===(fProc.value||'').trim());
 if(!rs.length){msg('삭제할 세부공정이 없습니다. (공정코드 확인)');return}
 if(!confirm(`${sel.job_no} / ${fProc.value} 세부공정 ${rs.length}건을 삭제하시겠습니까?`))return;
 try{for(const r of rs)await MESDB.table('design_plan_steps').delete({row_no:r.row_no});
  await reloadSteps(sel.job_no);msg(`세부공정 ${rs.length}건을 삭제했습니다.`);
 }catch(e){msg('삭제 실패: '+String(e.message||e).slice(0,120))}
}
window.MES={search,save,setMessage:msg,reload:loadPool};render();loadPool();</script><script src="mes_db.js?v=35"></script>
<script>
MESDB.master({page:"design_plan_input:heads",table:"design_plans",pk:"job_no",map:{"row_no": {"col": "row_no", "type": "num"}, "job_no": "job_no", "item_name": "item_name", "customer_name": "customer_name", "design_completion_planned_date": {"col": "design_completion_planned_date", "type": "date"}, "s1_date": {"col": "s1_date", "type": "date"}, "customer_request_date": {"col": "customer_request_date", "type": "date"}, "plant_name": "plant_name"},get:()=>heads,render:()=>{if(typeof view!=="undefined")view=[...heads];(window.render||window.search||function(){})()}});
MESDB.master({page:"design_plan_input:steps",table:"design_plan_steps",pk:"row_no",map:{"row_no": {"col": "row_no", "type": "num"}, "job_no": "job_no", "process_code": "process_code", "process_name": "process_name", "manager_name": "manager_name", "machining_process_code": "machining_process_code", "machining_process_name": "machining_process_name", "completion_planned_date": {"col": "completion_planned_date", "type": "date"}},get:()=>steps,render:()=>{if(typeof view!=="undefined")view=[...heads];(window.render||window.search||function(){})()}});
</script>
<script src="mes_ctx.js?v=1"></script>
