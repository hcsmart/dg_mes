<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>검사구분</title><style>
:root{--line:#9ba8b4;--line2:#c7d1d9;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#caddea}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}.content{width:min(930px,calc(100% - 28px));margin-left:14px}
.title{height:49px;padding:9px 14px 5px;border-bottom:2px solid #3978ae}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#98a4ad;margin-left:10px}
.form{padding:8px 0 7px;border-bottom:1px solid var(--line2);background:#fafbfc}.formrow{display:grid;grid-template-columns:96px 150px 96px 210px 70px 1fr;gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{height:27px;display:flex;align-items:center;justify-content:center;border:1px solid #bdc7cf;background:#eef2f5;font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px}.wide{grid-column:2/-1}.searchline{height:39px;display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-bottom:0;padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,52vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}.btn{height:28px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}
.gridbox{flex:1;min-height:0;border:1px solid var(--line);overflow:auto;background:#fff}.gridbox.compact{max-height:430px;flex:0 1 430px}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{height:28px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}
.foot{height:43px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:760px){.content{width:calc(100% - 12px);margin-left:6px}.formrow{grid-template-columns:82px 1fr}}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:96px minmax(0,1fr) 96px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:96px minmax(0,1fr)}}
.formrow>*{min-width:0}
</style><!-- v21: 사진 미촬영. 통상적인 검사구분 마스터 구성으로 직접 설계 --></head><body><div class="screen">
<div class="title"><h1>검사구분 <small>검사 유형별 대상·시점·검사방식을 관리합니다.</small></h1></div>
<div class="content"><section class="form"><div class="formrow"><div class="label">검사구분코드</div><input id="code" class="field"><div class="label">검사구분명</div><input id="name" class="field"><div class="label">검사대상</div><select id="target" class="field"><option>원재료</option><option>구매품</option><option>외주품</option><option>반제품</option><option>완제품</option></select><div class="label">검사시점</div><select id="timing" class="field"><option>입고시</option><option>공정중</option><option>공정완료</option><option>출하전</option></select><div class="label">검사방식</div><select id="sampling" class="field"><option>전수</option><option>샘플링</option><option>무검사</option></select><div class="label">정렬순서</div><input id="order" class="field r" type="number" min="1" max="999" value="10" step="10"><div class="label">사용여부</div><select id="use" class="field"><option>Y</option><option>N</option></select><div class="label">비고</div><input id="remark" class="field"></div></section>
<div class="gridbox compact"><table><thead><tr><th style="width:46px">No</th><th style="width:100px">검사구분코드</th><th style="width:140px">검사구분명</th><th style="width:90px">검사대상</th><th style="width:90px">검사시점</th><th style="width:80px">검사방식</th><th style="width:70px">정렬순서</th><th style="width:70px">사용여부</th><th>비고</th></tr></thead><tbody id="body"></tbody></table></div></div>
<footer class="foot"><input id="query" class="field" style="width:180px" placeholder="검사구분코드/명 검색" oninput="search()"><button class="btn" onclick="search()">⌕ 조회</button><button class="btn" onclick="save()">▣ 저장</button><button class="btn" onclick="remove()">✖ 삭제</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">데이터를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
const data=[{"code": "IC01", "name": "수입검사", "target": "원재료", "timing": "입고시", "sampling": "샘플링", "order": 10, "use": "Y", "remark": "재질/치수 확인"}, {"code": "IC02", "name": "구매품검사", "target": "구매품", "timing": "입고시", "sampling": "샘플링", "order": 20, "use": "Y", "remark": "규격품 사양 확인"}, {"code": "IC03", "name": "외주가공검사", "target": "외주품", "timing": "입고시", "sampling": "전수", "order": 30, "use": "Y", "remark": "가공 정밀도 확인"}, {"code": "IC04", "name": "공정검사", "target": "반제품", "timing": "공정중", "sampling": "샘플링", "order": 40, "use": "Y", "remark": "가공 중 자주검사"}, {"code": "IC05", "name": "최종검사", "target": "반제품", "timing": "공정완료", "sampling": "전수", "order": 50, "use": "Y", "remark": "조립 전 부품 확인"}, {"code": "IC06", "name": "조립검사", "target": "완제품", "timing": "공정완료", "sampling": "전수", "order": 60, "use": "Y", "remark": "조립 상태/작동 확인"}, {"code": "IC07", "name": "시험(T/O)검사", "target": "완제품", "timing": "공정완료", "sampling": "전수", "order": 70, "use": "Y", "remark": "트라이아웃 성형품 확인"}, {"code": "IC08", "name": "출하검사", "target": "완제품", "timing": "출하전", "sampling": "전수", "order": 80, "use": "Y", "remark": "포장 전 최종 확인"}, {"code": "IC09", "name": "무검사", "target": "구매품", "timing": "입고시", "sampling": "무검사", "order": 90, "use": "Y", "remark": "승인업체 납품분"}];
let view=[...data],selected=-1;
const fieldIds=["code", "name", "target", "timing", "sampling", "order", "use", "remark"], colKeys=["code", "name", "target", "timing", "sampling", "order", "use", "remark"], keyName='code';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){view.sort((a,b)=>(Number(a.order)||999)-(Number(b.order)||999));body.innerHTML=view.map((r,i)=>`<tr onclick="selectRow(&quot;${String(r.code).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}&quot;,this)"><td class="c">${i+1}</td><td>${esc(r.code)}</td><td>${esc(r.name)}</td><td class="c">${esc(r.target)}</td><td class="c">${esc(r.timing)}</td><td class="c">${esc(r.sampling)}</td><td class="r">${esc(r.order)}</td><td class="c">${esc(r.use)}</td><td>${esc(r.remark)}</td></tr>`).join('');countText.textContent=`${view.length}건`}
function selectRow(k,tr){selected=data.findIndex(x=>String(x.code)===String(k));document.querySelectorAll('tbody tr').forEach(x=>x.classList.remove('sel'));tr?.classList.add('sel');const r=data[selected];if(!r)return;fieldIds.forEach(id=>{const e=document.getElementById(id);if(e)e.value=r[id]??''});msg(`${k} 항목을 선택했습니다.`)}
function search(){const q=(document.getElementById('query')?.value||'').trim().toLowerCase();if(q)view=data.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));else{const code=(document.getElementById('code')?.value||'').trim().toLowerCase(),name=(document.getElementById('name')?.value||'').trim().toLowerCase();view=data.filter(r=>(!code||String(r.code).toLowerCase().includes(code))&&(!name||String(r.name).toLowerCase().includes(name)))}render();msg(`검색 결과 ${view.length}건입니다.`)}
function clearSearch(){const q=document.getElementById('query');if(q)q.value='';view=[...data];render();msg('검색조건을 초기화했습니다.')}
function add(){selected=-1;fieldIds.forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});msg('신규 항목을 입력하세요.')}
function save(){const k=String(code.value||'').trim();if(!k)return msg('코드를 입력하세요.');let r=selected>=0?data[selected]:data.find(x=>String(x.code)===k);if(!r){r={};data.push(r)}fieldIds.forEach(id=>r[id]=document.getElementById(id)?.value||'');selected=data.indexOf(r);view=[...data];render();msg(`${k} 항목을 저장했습니다.`)}
function remove(){if(selected<0)return msg('삭제할 항목을 선택하세요.');if(!confirm('선택한 항목을 삭제하시겠습니까?'))return;const k=data[selected].code;data.splice(selected,1);selected=-1;view=[...data];render();add();msg(`${k} 항목을 삭제했습니다.`)}
function exportCsv(){const out=[["검사구분코드", "검사구분명", "검사대상", "검사시점", "검사방식", "정렬순서", "사용여부", "비고"],...data.map(r=>[r.code??'',r.name??'',r.target??'',r.timing??'',r.sampling??'',r.order??'',r.use??'',r.remark??''])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='business_division_info.csv';a.click();URL.revokeObjectURL(a.href);msg('CSV 파일을 생성했습니다.')}
function msg(t){message.textContent=t}window.MES={search,add,delete:remove,save,exportCsv,setMessage:msg};render();
</script>
<script src="mes_db.js?v=35"></script>
<script>MESDB.master({page:"inspection_category",table:"inspection_categories",pk:"code",map:{"code":"inspection_category_code","name":"inspection_category_name","target":"inspection_target","timing":"inspection_timing","sampling":"sampling_type","order":{"col":"sort_order","type":"num"},"use":{"col":"is_active","type":"ynbool"},"remark":"remark"},get:()=>data,render:()=>{view=[...data];render()}});</script>
<script src="mes_ctx.js?v=1"></script>
</body></html>
