<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>설비등록</title><style>
:root{--line:#9ba8b4;--line2:#c6d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#cbddea}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:9px 14px 5px;border-bottom:2px solid #3978ae}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:10px}
.form{padding:8px 14px 7px;border-bottom:1px solid var(--line2);background:#fafbfc}.formgrid{display:grid;grid-template-columns:92px 160px 92px 180px 92px minmax(170px,1fr);gap:5px;align-items:center}.formgrid+.formgrid{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px}
.searchline{height:38px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}.btn{height:28px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}
.gridbox{flex:1;min-height:0;margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}table{border-collapse:collapse;min-width:900px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}
.foot{height:43px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:860px){.formgrid{grid-template-columns:86px 1fr 86px 1fr}.gridbox{margin:0 6px}.searchline{margin:0 6px}}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formgrid{grid-template-columns:92px minmax(0,1fr) 92px minmax(0,1fr)}}
@media(max-width:880px){.formgrid{grid-template-columns:92px minmax(0,1fr)}}
.formgrid>*{min-width:0}
</style></head>
<body><div class="screen">
<div class="title"><h1>설비등록 <small>생산/가공 설비의 코드, 그룹, 사용여부를 관리합니다.</small></h1></div>
<section class="form"><div class="formgrid"><div class="label">설비코드</div><input id="code" class="field"><div class="label">설비명</div><input id="name" class="field"><div class="label">설비그룹</div><select id="group" class="field"><option></option><option>가공</option><option>사상</option><option>주조</option><option>검사</option><option>조립</option></select></div><div class="formgrid"><div class="label">비고</div><input id="remark" class="field"><div class="label">사용여부</div><select id="use" class="field"><option>Y</option><option>N</option></select><div class="label"></div><span></span></div></section>
<div class="searchline"><input id="query" placeholder="Enter text to search..."><button class="btn" onclick="search()">찾기</button><button class="btn" onclick="clearSearch()">지우기</button></div>
<div class="gridbox"><table><thead><tr><th style="width:44px">No</th><th style="width:120px">설비코드</th><th style="width:260px">설비명</th><th style="width:150px">설비그룹</th><th style="width:220px">비고</th><th style="width:90px">사용여부</th></tr></thead><tbody id="body"></tbody></table></div>
<footer class="foot"><button class="btn" onclick="save()">▣ 저장</button><button class="btn" onclick="add()">＋ 신규</button><button class="btn" onclick="remove()">✖ 삭제</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">데이터를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div><script>
const data=[{"code": "DB001", "name": "사상부스", "group": "사상", "remark": "", "use": "N"}, {"code": "DGCO04", "name": "AIR COMPRESSOR", "group": "", "remark": "", "use": "Y"}, {"code": "DGCO07", "name": "AIR COMPRESSOR", "group": "", "remark": "", "use": "Y"}, {"code": "DGDR02", "name": "RADIAL(1500)", "group": "주조", "remark": "풍신", "use": "Y"}, {"code": "DGDR03", "name": "RADIAL(2000)", "group": "주조", "remark": "남동", "use": "Y"}, {"code": "DGGR01", "name": "평면연삭기(유일)", "group": "", "remark": "YGS-2290", "use": "Y"}, {"code": "DGGR04", "name": "평면연삭기(유일)", "group": "", "remark": "YGS-116A", "use": "Y"}, {"code": "DGGR07", "name": "성형연삭기(대산-1)", "group": "", "remark": "", "use": "Y"}, {"code": "DGGR08", "name": "성형연삭기(대산-2)", "group": "", "remark": "", "use": "Y"}, {"code": "DGLA01", "name": "선반(통일)", "group": "", "remark": "TIPL-4", "use": "Y"}, {"code": "DGMC03", "name": "NO9.6호기(두산)", "group": "", "remark": "VM-960", "use": "Y"}, {"code": "DGMC04", "name": "NO6.5호기(두산)", "group": "", "remark": "NYNX6500", "use": "Y"}, {"code": "DGMC05", "name": "NC12호기", "group": "", "remark": "", "use": "Y"}, {"code": "DGMC06", "name": "NC20호기", "group": "", "remark": "", "use": "Y"}, {"code": "DGME01", "name": "3차원측정기", "group": "", "remark": "DMB-U5S", "use": "Y"}, {"code": "DGMI01", "name": "밀링5호기(두산)", "group": "", "remark": "FM-2TH", "use": "Y"}, {"code": "DGMI02", "name": "밀링2호기(PUM-TECH)", "group": "", "remark": "", "use": "Y"}];
let view=[...data],selected=-1;
const fieldIds=["code", "name", "group", "remark", "use"], colKeys=["code", "name", "group", "remark", "use"], keyName="code";
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){body.innerHTML=view.map((r,i)=>`<tr onclick="selectRow(&quot;${String(r[keyName]).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}&quot;,this)"><td class="c">${i+1}</td>`+colKeys.map(k=>`<td>${esc(r[k])}</td>`).join('')+`</tr>`).join('');countText.textContent=`${view.length}건`}
function selectRow(k,tr){selected=data.findIndex(x=>String(x[keyName])===String(k));document.querySelectorAll('tbody tr').forEach(x=>x.classList.remove('sel'));tr?.classList.add('sel');const r=data[selected];if(!r)return;fieldIds.forEach(id=>{const e=document.getElementById(id);if(e)e.value=r[id]??''});msg(`${k} 항목을 선택했습니다.`)}
function search(){const q=query.value.trim().toLowerCase();view=!q?[...data]:data.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));render();msg(`검색 결과 ${view.length}건입니다.`)}
function clearSearch(){query.value='';view=[...data];render();msg('검색조건을 초기화했습니다.')}
function add(){selected=-1;fieldIds.forEach(id=>{const e=document.getElementById(id);if(e){if(e.tagName==='SELECT')e.selectedIndex=0;else e.value=''}});msg('신규 항목을 입력하세요.')}
function save(){const k=String(document.getElementById(keyName)?.value||'').trim();if(!k)return msg('코드를 입력하세요.');let r=selected>=0?data[selected]:data.find(x=>String(x[keyName])===k);if(!r){r={};data.push(r)}fieldIds.forEach(id=>{const e=document.getElementById(id);if(e)r[id]=e.value});selected=data.indexOf(r);view=[...data];render();msg(`${k} 항목을 저장했습니다.`)}
function remove(){if(selected<0)return msg('삭제할 항목을 선택하세요.');if(!confirm('선택한 항목을 삭제하시겠습니까?'))return;const k=data[selected][keyName];data.splice(selected,1);selected=-1;view=[...data];render();add();msg(`${k} 항목을 삭제했습니다.`)}
function exportCsv(){const header=["설비코드", "설비명", "설비그룹", "비고", "사용여부"];const out=[header,...data.map(r=>colKeys.map(k=>r[k]??''))];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download="equipment_registration.csv";a.click();URL.revokeObjectURL(a.href);msg('CSV 파일을 생성했습니다.')}
function msg(t){message.textContent=t} window.MES={search,add,delete:remove,save,exportCsv,setMessage:msg};render();
</script><script src="mes_db.js"></script>
<script>MESDB.master({page:"equipment_registration",table:"equipment",pk:"code",map:{"code": "equipment_code", "name": "equipment_name", "group": "equipment_group", "remark": "remark", "use": {"col": "is_active", "type": "ynbool"}},get:()=>data,render:()=>{view=[...data];render()}});</script>
</body></html>
