<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>공정단가변동 등록</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
</style></head><body><div class="screen">
<div class="title"><h1>공정단가변동 등록</h1></div>
<section class="form">
 <div class="formrow"><div class="label">등록일</div><input type="date" id="regDate" class="field" value="2026-08-22"><div class="label">담당자</div><input id="registrant" class="field" value="DG"><div class="label">가공공정그룹</div><select id="group" class="field"><option>설계</option><option>가공</option><option>조립</option></select><div class="label">가공공정</div><input id="process" class="field"></div>
 <div class="formrow"><div class="label">적용시작일</div><input type="date" id="effective" class="field"><div class="label">단가</div><input type="number" id="price" class="field" value="0"><div class="label">협력업체</div><input id="vendor" class="field"><div></div><div></div></div>
</section>
<div class="entrybox"><table><thead><tr><th style="width:180px">적용시작일</th><th style="width:150px">단가</th><th></th></tr></thead><tbody><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr></tbody></table></div>
<div class="toolbar"><button class="btn" onclick="save()">▣ 저장</button><button class="btn" onclick="remove()">✖ 삭제</button></div>
<div class="searchline"><input id="query" placeholder="검색어를 입력하세요."><button class="btn" onclick="search()">찾기</button><button class="btn" onclick="clearSearch()">지우기</button></div>
<div class="gridbox"><table><thead><tr><th>등록일</th><th>가공공정그룹</th><th>가공공정코드</th><th>가공공정명</th><th>협력업체코드</th><th>협력업체명</th><th>단가</th><th>담당자</th></tr></thead><tbody id="body"></tbody></table></div>
<footer class="foot"><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">공정단가 데이터를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div><script>
const data=[{"process_code": "DA", "process_name": "레이아웃", "process_group": "설계", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "user11", "manager_name": null, "registered_date": "2025-02-01", "effective_date": null}, {"process_code": "DL", "process_name": "조립도", "process_group": "설계", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "user11", "manager_name": null, "registered_date": "2024-11-15", "effective_date": null}, {"process_code": "DP", "process_name": "부품도", "process_group": "설계", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "user11", "manager_name": null, "registered_date": "2024-11-15", "effective_date": null}, {"process_code": "AS", "process_name": "래핑,조립", "process_group": "조립", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": null, "manager_name": "한서연", "registered_date": null, "effective_date": "2025-02-01"}, {"process_code": "CQ", "process_name": "품질육성", "process_group": "조립", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": null, "manager_name": "김지호", "registered_date": null, "effective_date": "2025-02-01"}, {"process_code": "S1", "process_name": "S1", "process_group": "조립", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": null, "manager_name": "김지호", "registered_date": null, "effective_date": "2025-02-01"}, {"process_code": "TO", "process_name": "시험", "process_group": "조립", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": null, "manager_name": "김지호", "registered_date": null, "effective_date": "2025-02-01"}, {"process_code": "CT", "process_name": "코팅", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "DR", "process_name": "DRILLING", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "GG", "process_name": "원통연삭", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "GL", "process_name": "평면연삭(대형)", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "GM", "process_name": "평면연삭(중형)", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "GS", "process_name": "성형연삭(소형)", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "HA", "process_name": "홀가공", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "HQ", "process_name": "열처리", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "LM", "process_name": "선반", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "LM1", "process_name": "선반 정삭", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "LM2", "process_name": "선반 열처리 정삭", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "MA", "process_name": "면삭밀링(소형)", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "MF", "process_name": "면삭밀링(대형)", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "MP", "process_name": "면삭밀링(초대형)", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}, {"process_code": "MS", "process_name": "성형밀링(소형)", "process_group": "가공", "vendor_code": "V000", "vendor_name": "동구기업", "unit_price":60100, "registered_by": "DG", "manager_name": "동구", "registered_date": "2026-06-04", "effective_date": "2026-06-03"}];let view=[...data];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){body.innerHTML=view.filter(r=>r.registered_date).map(r=>`<tr><td>${esc(r.registered_date)}</td><td>${esc(r.process_group)}</td><td>${esc(r.process_code)}</td><td>${esc(r.process_name)}</td><td>${esc(r.vendor_code)}</td><td>${esc(r.vendor_name)}</td><td class="num">${Number(r.unit_price).toLocaleString()}</td><td>${esc(r.registered_by||'')}</td></tr>`).join('');countText.textContent=`${view.filter(r=>r.registered_date).length}건`}
function search(){const q=query.value.trim().toLowerCase();view=!q?[...data]:data.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));render()}
function clearSearch(){query.value='';view=[...data];render()}
function save(){message.textContent='프로토타입 화면에 입력값을 반영했습니다. JSON 원본은 변경하지 않습니다.'}
function remove(){message.textContent='프로토타입에서는 원본 JSON 삭제를 수행하지 않습니다.'}
function exportCsv(){const rows=view.filter(r=>r.registered_date);const h=['등록일','가공공정그룹','가공공정코드','가공공정명','협력업체코드','협력업체명','단가','담당자'];const csv='\ufeff'+[h,...rows.map(r=>[r.registered_date,r.process_group,r.process_code,r.process_name,r.vendor_code,r.vendor_name,r.unit_price,r.registered_by])].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='process_price_change_registration.csv';a.click()}
window.MES={search,save,delete:remove,exportCsv,setMessage:t=>message.textContent=t};render();
</script><script src="mes_db.js"></script>
<script>MESDB.bind("process_price_change_registration",()=>({data}));</script>
</body></html>
