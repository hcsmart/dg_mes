<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>외주설계발주현황</title>
<style>
:root{--line:#9daab6;--line2:#c5ced6;--ink:#344758}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}button,input,select{font:inherit;color:inherit}
.screen{height:100%;display:flex;flex-direction:column}.title{height:46px;padding:9px 14px 4px;border-bottom:2px solid #3977ad;display:flex;align-items:center;gap:14px}.title h1{margin:0;font-size:21px;font-weight:500;color:#4b5b69}.title h1:before{content:'◯';margin-right:6px;color:#8795a1}.title .plant{margin-left:auto;display:flex;align-items:center;gap:6px;color:#6b7885}
.filters{padding:7px 14px;border-bottom:1px solid var(--line2);background:#fafbfc}.frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.frow+.frow{margin-top:5px}.label{font-weight:700}.field{height:26px;border:1px solid #b7c2cb;background:#fff;padding:0 6px;outline:none}.field:focus{border-color:#4e88bb}.radios{display:flex;gap:9px;color:#5f6d79}
.gridbox{flex:1;min-height:0;margin:7px 14px;border:1px solid var(--line);display:flex;flex-direction:column;background:#fff}
.tablewrap{flex:1;min-height:0;overflow:auto}table{border-collapse:collapse;min-width:1720px;width:100%;table-layout:fixed}th,td{height:25px;padding:0 5px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(#dbe9f4,#c7d9e8);color:#405266;font-weight:700}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2e78bd;color:#fff}.c{text-align:center}.r{text-align:right}
tfoot th{position:sticky;bottom:0;background:linear-gradient(#e6eef5,#d3e0ea)}
.bar{position:relative;height:14px;background:#e2e8ed;border:1px solid #c3ccd4}.bar i{position:absolute;left:0;top:0;bottom:0;background:#4a8cc7}.bar b{position:relative;display:block;text-align:center;font-weight:400;font-size:11px;line-height:12px;color:#2b3d4d}
.btn{height:28px;min-width:70px;border:1px solid #9ca9b5;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:10px;color:#687784}.foot .right{margin-left:auto;color:#7c8993}
@media(max-width:900px){.title h1{font-size:18px}}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>외주설계발주현황</h1><div class="plant"><span>공장</span><select id="plant" class="field"><option>1공장</option><option>2공장</option></select></div></div>
  <section class="filters">
    <div class="frow">
      <span class="label">구 분</span>
      <div class="radios"><label><input type="radio" name="st" value="전체" checked onchange="search()"> 전체</label><label><input type="radio" name="st" value="발주" onchange="search()"> 발주</label><label><input type="radio" name="st" value="입고" onchange="search()"> 입고</label></div>
      <span class="label">제 번</span><input id="jobQ" class="field" style="width:170px">
      <span class="label">품 명</span><input id="itemQ" class="field" style="width:170px">
      <span class="label">모 델</span><input id="modelQ" class="field" style="width:150px">
    </div>
    <div class="frow">
      <span class="label">발주일</span><input id="od1" class="field" type="date"><span>~</span><input id="od2" class="field" type="date">
      <span class="label">입고예정일</span><input id="ed1" class="field" type="date"><span>~</span><input id="ed2" class="field" type="date">
      <span class="label">입고일</span><input id="rd1" class="field" type="date"><span>~</span><input id="rd2" class="field" type="date">
      <button class="btn" onclick="search()">⌕ 조회</button>
    </div>
  </section>
  <div class="gridbox"><div class="tablewrap"><table>
    <colgroup><col style="width:44px"><col style="width:110px"><col style="width:130px"><col style="width:110px"><col style="width:74px"><col style="width:110px"><col style="width:108px"><col style="width:50px"><col style="width:74px"><col style="width:90px"><col style="width:90px"><col style="width:90px"><col style="width:96px"><col style="width:86px"><col style="width:92px"><col style="width:92px"><col style="width:100px"></colgroup>
    <thead><tr><th>No</th><th>제번</th><th>품명</th><th>모델</th><th>국내/해외</th><th>거래처</th><th>수주가</th><th>공정</th><th>유상사급</th><th>견적가</th><th>네고가</th><th>차액</th><th>협력업체</th><th>진행률</th><th>입고일</th><th>발주일</th><th>입고예정일</th></tr></thead>
    <tbody id="body"></tbody>
    <tfoot><tr><th colspan="9" class="r">합 계</th><th class="r" id="sumQuote">0</th><th class="r" id="sumNego">0</th><th class="r" id="sumDiff">0</th><th colspan="5"></th></tr></tfoot>
  </table></div></div>
  <footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn primary" onclick="exportCsv()">▤ EXCEL</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">외주설계 발주현황을 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div>
<script>
const rows=[];
let view=[...rows];
const money=v=>Number(v||0).toLocaleString('ko-KR');
function within(v,a,b){if(!a&&!b)return true;if(!v)return false;return (!a||v>=a)&&(!b||v<=b)}
function render(){body.innerHTML=view.map((r,i)=>`<tr onclick="sel(this)"><td class="c">${i+1}</td><td>${r.job}</td><td>${r.item}</td><td>${r.model}</td><td class="c">${r.area}</td><td>${r.cust}</td><td class="r">${money(r.amount)}</td><td class="c">${r.proc}</td><td class="c">${r.paid}</td><td class="r">${money(r.quote)}</td><td class="r">${money(r.nego)}</td><td class="r">${money(r.diff)}</td><td>${r.partner}</td><td><div class="bar"><i style="width:${r.rate}%"></i><b>${r.rate}%</b></div></td><td class="c">${r.idate}</td><td class="c">${r.odate}</td><td class="c">${r.edate}</td></tr>`).join('');
sumQuote.textContent=money(view.reduce((a,r)=>a+r.quote,0));sumNego.textContent=money(view.reduce((a,r)=>a+r.nego,0));sumDiff.textContent=money(view.reduce((a,r)=>a+r.diff,0));countText.textContent=`${view.length}건`}
function sel(tr){document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel')}
function search(){const st=document.querySelector('input[name=st]:checked').value;const j=jobQ.value.trim().toLowerCase(),it=itemQ.value.trim().toLowerCase(),m=modelQ.value.trim().toLowerCase();
view=rows.filter(r=>(st==='전체'||(st==='입고'?!!r.idate:!r.idate))&&(!j||r.job.toLowerCase().includes(j))&&(!it||r.item.toLowerCase().includes(it))&&(!m||r.model.toLowerCase().includes(m))&&within(r.odate,od1.value,od2.value)&&within(r.edate,ed1.value,ed2.value)&&within(r.idate,rd1.value,rd2.value));
render();msg(`${st} 기준 ${view.length}건을 조회했습니다.`)}
function exportCsv(){const out=[['제번','품명','모델','국내/해외','거래처','수주가','공정','견적가','네고가','차액','협력업체','진행률','입고일','발주일','입고예정일'],...view.map(r=>[r.job,r.item,r.model,r.area,r.cust,r.amount,r.proc,r.quote,r.nego,r.diff,r.partner,r.rate,r.idate,r.odate,r.edate])];const csv='\ufeff'+out.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='outsourced_design_order_status.csv';a.click();URL.revokeObjectURL(a.href);msg('EXCEL(CSV) 파일을 생성했습니다.')}
function msg(t){message.textContent=t}
render();window.MES={search,exportCsv,setMessage:msg};
</script>
<script src="mes_db.js?v=25"></script>
<script>MESDB.bind("outsourced_design_order_status",()=>({rows}));</script>
<script src="mes_ctx.js?v=1"></script>
</body>
</html>
