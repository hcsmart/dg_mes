<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>사용자정보</title>
<style>
:root{--line:#9aa7b3;--line2:#c7d2db;--blue:#2c73b4;--blue2:#d7e7f2;--ink:#354858;--bg:#f6f8fa}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:50px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center;gap:8px}
.title h1{margin:0;font-size:22px;font-weight:500;color:#4d5d69}.title h1:before{content:'◯';margin-right:6px;color:#8c9aa5}
.body{flex:1;min-height:0;display:grid;grid-template-columns:36% 64%;gap:8px;padding:7px 10px}
.panel{border:1px solid var(--line);background:#fff;min-height:0;display:flex;flex-direction:column}
.cap{height:28px;display:flex;align-items:center;padding:0 8px;background:linear-gradient(#f5f8fa,#e6edf2);border-bottom:1px solid var(--line);font-weight:700}
.filters{display:grid;grid-template-columns:74px 1fr 74px 1fr;gap:3px;padding:5px;border-bottom:1px solid var(--line2)}
.lab{background:#eef2f5;border:1px solid #c4cdd5;display:flex;align-items:center;justify-content:center;min-height:25px}
.field{height:25px;border:1px solid #b7c1ca;background:#fff;padding:0 6px;min-width:0}
.userlist{flex:1;min-height:0;overflow:auto}
.group-title{height:25px;display:flex;align-items:center;padding:0 8px;background:#edf3f7;border-bottom:1px solid #c8d3dc;color:#3b556d;font-weight:700}
.user-row{display:grid;grid-template-columns:1fr 1.4fr;min-height:26px;border-bottom:1px solid #e0e6eb}
.user-row span{padding:5px 8px;border-right:1px solid #e0e6eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-row:hover{background:#eef6fc}.user-row.on{background:#2f76b7;color:#fff}
.right{min-height:0;display:grid;grid-template-rows:auto 42px minmax(0,1fr);gap:7px}
.detail{border:1px solid var(--line)}
.detail-grid{display:grid;grid-template-columns:78px 1fr 78px 1fr 78px 1fr;gap:0}
.detail-grid .lab,.detail-grid .field{border-top:0;border-left:0}
.detail-grid .field{width:100%}
.detail-grid .check{height:25px;border-right:1px solid #b7c1ca;border-bottom:1px solid #b7c1ca;display:flex;align-items:center;padding-left:8px}
.actions{display:flex;align-items:center;gap:5px;padding-left:3px}
.btn{height:29px;min-width:72px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb)}.btn:hover{background:#fff}
.permission{border:1px solid var(--line);min-height:0;display:flex;flex-direction:column}
.permission-head{display:grid;grid-template-columns:1fr 250px;background:linear-gradient(#e7f0f7,#cadae7);border-bottom:1px solid var(--line);font-weight:700}
.permission-head div{padding:6px 8px;border-right:1px solid #aebbc6}
.permission-list{flex:1;min-height:0;overflow:auto;background:#fff}
.btn.primary{background:linear-gradient(#f9ffff,#d2e7f6);color:#1e5e91}
.perm-row{display:grid;grid-template-columns:1fr 300px;min-height:26px;border-bottom:1px solid #e0e6eb;align-items:center}
.perm-row.mod{background:linear-gradient(#eef5fb,#e2edf6);font-weight:700}
.perm-row.sec{background:#f7fafc}
.perm-row:hover{background:#edf6fd}
.perm-row .toggle{cursor:pointer;user-select:none;display:inline-block;width:14px;color:#5b6b7a}
.rights{display:flex;gap:10px;justify-content:flex-start}
.rights label{display:flex;align-items:center;gap:3px;cursor:pointer;white-space:nowrap}
.rights input{margin:0}
.perm-row div{padding:5px 8px;border-right:1px solid #e0e6eb}
.path{padding-left:calc(8px + var(--depth)*15px)!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.full{color:#b03a34;font-weight:700}.none{color:#b03a34}
.note{padding:10px;color:#7c8993}
.foot{height:40px;display:flex;align-items:center;padding:5px 10px;border-top:1px solid var(--line);background:#edf2f5;gap:5px}
.msg{margin-left:8px;color:#687784}
#toast{position:fixed;left:50%;top:22px;transform:translateX(-50%) translateY(-14px);z-index:99999;padding:10px 22px;border-radius:4px;font-size:13px;color:#fff;background:#2e7d32;box-shadow:0 4px 16px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:#c62828}
#toast.warn{background:#ef6c00}.rightmsg{margin-left:auto;color:#7d8993}
@media(max-width:1000px){.body{grid-template-columns:42% 58%}.detail-grid{grid-template-columns:74px 1fr 74px 1fr}}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.detail-grid{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.detail-grid{grid-template-columns:78px minmax(0,1fr)}}
.detail-grid>*{min-width:0}
</style>
</head>
<body>
<div class="screen">
  <div class="title"><h1>사용자정보</h1></div>

    <section class="panel">

      </div>

    </section>

    <section class="right">
      <div class="detail">
        <div class="cap">사용자정보</div>
        <div class="detail-grid">
          <div class="lab">공장</div><select id="d_factory" class="field"><option>1공장</option></select>
          <div class="lab">등록일</div><input id="d_registered" class="field" type="date">
          <div class="lab" title="체크하면 사용여부가 해제된 사용자까지 모두 표시합니다">전체</div><div class="check"><input type="checkbox" id="d_all" onchange="renderUsers()" title="미사용 사용자 포함 표시"></div>

          <div class="lab">아이디</div><input id="d_user_id" class="field">
          <div class="lab">성명</div><input id="d_name" class="field">
          <div class="lab">성명(영문)</div><input id="d_english_name" class="field">

          <div class="lab">비밀번호</div><input id="d_pw" class="field" value="******" readonly title="마스터만 발급 비밀번호를 확인할 수 있습니다">
          <div class="lab">사용자그룹</div><select id="d_user_group" class="field"><option></option><option>사용자</option></select>
          <div class="lab">공정그룹</div><input id="d_process_group" class="field">

          <div class="lab">부서</div><input id="d_department" class="field">
          <div class="lab">사업부</div><input id="d_business_division" class="field">
          <div class="lab">휴대폰번호</div><input id="d_mobile" class="field">

          <div class="lab">직급</div><input id="d_position" class="field">
          <div class="lab">전화번호</div><input id="d_phone" class="field">
          <div class="lab">이메일</div><input id="d_email" class="field">

          <div class="lab">사원번호</div><input id="d_employee_no" class="field">
          <div class="lab" title="해제하면 로그인이 차단되고 목록에서 숨겨집니다">사용여부</div><div class="check"><input id="d_active" type="checkbox" title="해제 시 해당 계정은 로그인할 수 없습니다"></div>
          <div class="lab">비고</div><input id="d_remark" class="field">
        <div class="lab">로그인메일</div><input id="d_auth_email" class="field" placeholder="user@dgmes.demo">
        <div class="lab">권한역할</div><select id="d_role" class="field"><option value="user">user</option><option value="admin">admin</option><option value="master">master</option></select>
        </div>
      </div>

      <div class="actions">
        <button class="btn" onclick="refresh()">⟳ 새로고침</button>
        <button class="btn" onclick="saveUser()">▣ 저장</button>
        <button class="btn" onclick="deleteUser()">✖ 삭제</button>
        <button class="btn primary" onclick="registerUser()">＋ 신규 사용자 등록</button>
        <button class="btn" onclick="resetPassword()">🔑 비밀번호 재설정</button>
        <button class="btn" id="btnShowPw" onclick="togglePasswords()" style="display:none">👁 비밀번호 보기 (마스터)</button>
        <button class="btn" onclick="expandAll(true)">⊞ 전체펼침</button>
        <button class="btn" onclick="expandAll(false)">⊟ 접기</button>
        <button class="btn primary" onclick="savePermissions()">🔒 권한저장</button>
        <button class="btn" onclick="copyPermissions()">⧉ 권한복사</button>
      </div>

      <div class="permission">
        <div class="cap">권한</div>
        <div class="permission-head"><div>메뉴명</div><div class="rights"><label><input type="checkbox" onclick="setAll('view',this.checked)">조회</label><label><input type="checkbox" onclick="setAll('save',this.checked)">저장</label><label><input type="checkbox" onclick="setAll('edit',this.checked)">수정</label><label><input type="checkbox" onclick="setAll('del',this.checked)">삭제</label></div></div>
        <div class="permission-list" id="permList"></div>
      </div>
    </section>
  </div>
  <footer class="foot">
    <button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button>
    <span class="msg" id="message">사용자 데이터를 조회했습니다.</span>
    <span class="rightmsg" id="countText"></span>
  </footer>
</div>

me": "과장", "user_group": "사용자", "is_active": true, "english_name": null, "business_division": null, "process_group": null, "mobile_phone": null, "email": null, "phone": null, "employee_no": null, "remark": null}, {"user_key": "10300_강지우", "user_id": null, "name": "강지우", "department_code": "10300", "department_name": "설계", "factory": "1공장", "registered_date": null, "position_code": null, "position_name": null, "user_group": null, "is_active": null}, {"user_key": "10300_권민준", "user_id": null, "name": "권민준", "department_code": "10300", "department_name": "설계", "factory": "1공장", "registered_date": null, "position_code": null, "position_name": null, "user_group": null, "is_active": null}, {"user_key": "40000_강대규", "user_id": null, "name": "강대규", "department_code": "40000", "department_name": "연구소", "factory": "1공장", "registered_date": null, "position_code": null, "position_name": null, "user_group": null, "is_active": null}];
const permissions = [{"user_key": "10300_장소율", "user_id": "user19", "menu_path": ["영업관리", "수주등록"], "menu_name": "수주등록", "permission_status": "none", "can_view": false, "can_save": false, "can_edit": false, "can_delete": false}, {"user_key": "10300_장소율", "user_id": "user19", "menu_path": ["영업관리", "수주현황"], "menu_name": "수주현황", "permission_status": "none", "can_view": false, "can_save": false, "can_edit": false, "can_delete": false}, {"user_key": "10300_장소율", "user_id": "user19", "menu_path": ["설계관리", "외주설계발주", "외주설계발주", "외주설계발주등록"], "menu_name": "외주설계발주등록", "permission_status": "full", "can_view": true, "can_save": true, "can_edit": true, "can_delete": true}, {"user_key": "10300_장소율", "user_id": "user19", "menu_path": ["설계관리", "외주설계발주", "외주설계발주", "외주설계발주현황"], "menu_name": "외주설계발주현황", "permission_status": "full", "can_view": true, "can_save": true, "can_edit": true, "can_delete": true}, {"user_key": "10300_장소율", "user_id": "user19", "menu_path": ["설계관리", "외주설계발주", "외주설계발주", "외주설계발주입고"], "menu_name": "외주설계발주입고", "permission_status": "full", "can_view": true, "can_save": true, "can_edit": true, "can_delete": true}];
let selectedKey = '10300_장소율';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function grouped(arr){
  /* v23: 고정 부서목록으로 필터하던 방식은 새 부서(예: 시스템) 사용자를 목록에서 누락시킴.
     실제 데이터의 부서를 모두 그룹으로 만들되, 기존 순서를 앞에 유지한다. */
  const order=['경영기획','공통','구매/가공','부서없음','설계','연구소'];
  const key=u=>String(u.department_name||'').trim()||'부서없음';
  const seen=new Map();
  for(const u of arr){const k=key(u); if(!seen.has(k))seen.set(k,[]); seen.get(k).push(u)}
  const out=[];
  for(const dept of order) if(seen.has(dept)){out.push([dept,seen.get(dept)]); seen.delete(dept)}
  for(const [dept,rows] of [...seen.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko'))) out.push([dept,rows]);
  return out;
}
function renderUsers(){
  const qv=(q.value||'').trim().toLowerCase();
  /* [전체] 체크 시 사용여부가 해제된(미사용) 사용자까지 표시 */
  const showAll=document.getElementById('d_all')?.checked===true;
  const list=users.filter(u=>{
    if(qv && ![u.name,u.user_id,u.department_name].some(v=>String(v??'').toLowerCase().includes(qv)))return false;
    if(!showAll && u.is_active===false)return false;
    return true;
  });
  userList.innerHTML=grouped(list).map(([dept,rows])=>`
    <div class="group-title">부서명: ${esc(dept)}</div>
    ${rows.map(u=>`<div class="user-row ${u.user_key===selectedKey?'on':''}" onclick="selectUser('${u.user_key.replaceAll("'","\\'")}')"><span>${esc(u.position_name||'')}</span><span style="${u.is_active===false?'color:#9aa5b1;text-decoration:line-through':''}">${esc(u.name)}${u.role==='master'?' <b style="color:#8e24aa">[마스터]</b>':u.role==='admin'?' <b style="color:#1e5e91">[관리자]</b>':''}${u.is_active===false?' <span style="color:#c62828;font-size:11px">(미사용)</span>':''}</span></div>`).join('')}
  `).join('');
  countText.textContent=`${list.length}명`;
}
function selectUser(key){
  if(dirty && selectedKey && key!==selectedKey){
    if(!confirm('저장하지 않은 권한 변경이 있습니다. 저장하지 않고 다른 사용자로 이동할까요?')){return}
    dirty=false; permLoadedFor=null; markDirty();
  }
  selectedKey=key;
  const u=users.find(x=>x.user_key===key);
  if(!u)return;
  d_factory.value=u.factory||'1공장';
  d_registered.value=u.registered_date||'';
  d_user_id.value=u.user_id||'';
  d_name.value=u.name||'';
  d_english_name.value=u.english_name||'';
  d_user_group.value=u.user_group||'';
  d_process_group.value=u.process_group||'';
  d_department.value=[u.department_code,u.department_name].filter(Boolean).join('  ');
  d_business_division.value=u.business_division||'';
  d_mobile.value=u.mobile_phone||'';

  }catch(e){message.textContent='삭제 실패: '+e.message.slice(0,160);toast('삭제 실패','err')}
}

renderUsers();selectUser(selectedKey);
</script>
