async function loadRows(){
 const online=()=>!!(window.MESDB&&MESDB.online);   /* v28: 미정의 online() 참조로 화면이 죽던 버그 수정 */

 if(!(window.MESDB&&MESDB.online)){msg('DB 미연결 — 사진 판독본을 표시합니다.');render();return}
 try{
  const rs=await MESDB.table('set_order_status_view').select('select=*&order=row_no');
  data.length=0;data.push(...rs);
  search();
  msg(`SET발주 ${data.length}건 (발주 ${rs.filter(r=>r.status==='발주').length} / 입고 ${rs.filter(r=>r.status!=='발주').length})`);

}
