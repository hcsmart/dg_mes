function go(d){pi=(pi+d+pages.length)%pages.length;render()}

const online=()=>!!(window.MESDB&&MESDB.online);
async function loadBoard(){
 if(!online()&&window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
 if(!online())return;
 try{
  try{NOTICES=await MESDB.table('notices').select('select=*&is_active=is.true&order=posted_date.desc&limit=10')}catch(e){}

 }catch(e){}
}
