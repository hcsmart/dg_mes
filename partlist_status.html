  msg(`PartList ${data.length}건 (원재료 ${rs.filter(r=>r.order_type==='원재료').length} / 구매품 ${rs.filter(r=>r.order_type==='구매품').length})`);
 }catch(e){msg('조회 실패: '+String(e.message||e).slice(0,120));render()}
}
function search(){const k=q_kind.value,j=q_job.value.trim().toLowerCase(),p=q_part.value.trim().toLowerCase(),pc=q_pc.value.trim().toLowerCase(),m=q_mat.value.trim().toLowerCase();
 view=data.filter(r=>(k==='전체'||r.order_type===k)&&(!j||r.job_no.toLowerCase().includes(j))&&(!p||String(r.part_name??'').toLowerCase().includes(p))
  &&(!pc||String(r.process_code??'').toLowerCase().includes(pc))&&(!m||String(r.material??'').toLowerCase().includes(m)));
 render();msg(`조회결과 ${view.length}건입니다.`);}
function csv(){msg('프로토타입에서는 EXCEL 내보내기를 지원하지 않습니다.')}
window.MES={search,setMessage:msg};render();</script><script src="mes_db.js?v=35"></script>
