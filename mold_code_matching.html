<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>금형코드 매칭</title><style>
:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}
.entrybox,.gridbox{margin:0 14px;border:1px solid var(--line);overflow:auto;background:#fff}.entrybox{height:190px}.gridbox{flex:1;min-height:0}
.searchline{height:39px;margin:0 14px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:4px 8px;background:#f6f8fa}.searchline input{width:min(430px,48vw);height:27px;border:1px solid #aeb9c3;padding:0 7px}
.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}
.foot{height:42px;display:flex;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:#eef2f5;gap:5px}.msg{margin-left:8px;color:#687784}.right{margin-left:auto;color:#7c8993}
.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}
@media(max-width:900px){.formrow{grid-template-columns:78px 1fr 78px 1fr}.entrybox,.gridbox,.searchline{margin-left:6px;margin-right:6px}}

.filt{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}
.fr{display:grid;gap:5px;align-items:center}
.lb{font-weight:700;text-align:right;padding-right:3px}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.opts label{display:flex;align-items:center;gap:3px;cursor:pointer}
.gtot td{background:#dfe9f2;font-weight:700}
.grp th{background:linear-gradient(#dbe9f5,#b9d2e6)}
.panes{flex:1;min-height:0;display:grid;gap:8px;padding:0 14px 8px}
.pane{border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.ph{padding:5px 9px;font-weight:700;background:linear-gradient(var(--head1),var(--head2));color:#405266;border-bottom:1px solid var(--line2)}
.pb{flex:1;min-height:0;overflow:auto}
.mask{position:fixed;inset:0;background:rgba(40,50,60,.3);display:none;align-items:flex-start;justify-content:center;z-index:50}
.mask.on{display:flex}
.dlg{margin-top:40px;width:min(980px,96vw);background:#f3f6f8;border:1px solid #7d8d99;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.dh{display:flex;align-items:center;height:30px;padding:0 6px 0 10px;background:linear-gradient(#eef4f9,#dbe6ef);border-bottom:1px solid #b9c6d0;font-weight:700}
.dh button{margin-left:auto;width:26px;height:20px;border:1px solid #b04a4a;background:#c9484a;color:#fff;cursor:pointer}
.db{padding:10px}
.kv{display:grid;grid-template-columns:repeat(4,86px minmax(90px,1fr));gap:4px;align-items:center}
.kv .lb{text-align:right}
.kv .v{border:1px solid #c3ccd4;background:#fff;height:26px;line-height:24px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* v21 입력란 배치 보정: 좁은 폭에서 필드를 숨기지 않고 단계적으로 줄바꿈 */
.field,.formrow input,.formrow select,.formgrid input,.formgrid select,.detail-grid input,.detail-grid select{min-width:0;max-width:100%}
.lab,.label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:1400px){.formrow{grid-template-columns:78px minmax(0,1fr) 78px minmax(0,1fr)}}
@media(max-width:880px){.formrow{grid-template-columns:78px minmax(0,1fr)}}
.formrow>*{min-width:0}
</style></head><body><div class="screen"><div class="title"><h1>금형코드 매칭</h1><small>1공장</small></div><section class="filt"><div class="opts"><span class="lb" style="width:60px">구 분</span><label><input type="radio" name="st" value="전체" checked>전체</label><label><input type="radio" name="st" value="미확정">미확정</label><label><input type="radio" name="st" value="확정">확정</label><span class="lb" style="width:60px">제 번</span><input id="q_job" class="field" style="width:180px"><span class="lb" style="width:60px">품 명</span><input id="q_item" class="field" style="width:180px"><span class="lb" style="width:60px">공 장</span><select class="field" style="width:110px"><option>1공장</option></select></div></section><div class="panes" style="grid-template-rows:1.6fr 1fr"><div class="pane"><div class="ph">제번 리스트</div><div class="pb"><table style="min-width:1240px"><thead><tr><th style="width:46px">NO</th><th style="width:120px">제번</th><th style="width:82px">견적서 No.</th><th style="width:76px">사업부</th><th style="width:96px">양산처</th><th style="width:70px">아이템</th><th style="width:72px">수주유형</th><th style="width:104px">ECO</th><th style="width:150px">모델</th><th style="width:76px">담당자</th><th style="width:150px">고객사</th><th style="width:64px">상태</th></tr></thead><tbody id="mbody"></tbody></table></div></div><div class="pane"><div class="ph">공정</div><div class="pb"><table style="min-width:0"><thead><tr><th style="width:140px">공정코드</th><th>공정명</th><th style="width:90px">수정가능</th></tr></thead><tbody id="pbody"></tbody></table></div></div></div><footer class="foot"><button class="btn" onclick="search()">⌕ 검색</button><button class="btn" onclick="save()">▤ 저장</button><button class="btn" onclick="del_()">✕ 삭제</button><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">사진에서 판독한 48건을 표시했습니다.</span><span class="right" id="countText"></span></footer></div><script>const data=[];const procs=[{"row_no": 1, "process_code": "A", "process_name": "1/5", "editable": false}, {"row_no": 2, "process_code": "B", "process_name": "2/5", "editable": true}, {"row_no": 3, "process_code": "C", "process_name": "3/5", "editable": true}, {"row_no": 4, "process_code": "D", "process_name": "4/5", "editable": true}, {"row_no": 5, "process_code": "E", "process_name": "5/5", "editable": true}];const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n=v=>v==null?'':Number(v).toLocaleString();const p=v=>v==null?'':Number(v).toFixed(1)+'%';
const msg=t=>message.textContent=t;
let view=[...data];
function render(){
 mbody.innerHTML=view.map((r,i)=>`<tr onclick="pick(${i},this)"><td class="c">${r.row_no}</td><td>${esc(r.job_no)}</td><td class="c">${esc(r.quotation_no||'')}</td><td class="c">${esc(r.business_division_name||'')}</td><td>${esc(r.mass_production_vendor_name||'')}</td><td class="c">${esc(r.item_name||'')}</td><td class="c">${esc(r.order_type||'')}</td><td>${esc(r.eco||'')}</td><td>${esc(r.model||'')}</td><td class="c">${esc(r.manager_name||'')}</td><td>${esc(r.customer_name||'')}</td><td class="c">${esc(r.match_status)}</td></tr>`).join('');
 countText.textContent=view.length+'건';pbody.innerHTML='';
}
function pick(i,tr){const r=view[i];sel=r;document.querySelectorAll('#mbody tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');
 pbody.innerHTML=procs.map(q=>`<tr><td>${esc(q.process_code)}</td><td>${esc(q.process_name)}</td><td class="c">${q.editable?'Y':'N'}</td></tr>`).join('');
 msg(`${r.job_no} · 공정 ${procs.length}건`);}
function search(){const st=document.querySelector('input[name="st"]:checked').value,j=q_job.value.trim().toLowerCase(),it=q_item.value.trim().toLowerCase();
 view=data.filter(r=>(st==='전체'||r.match_status===st)&&(!j||r.job_no.toLowerCase().includes(j))&&(!it||String(r.item_name??'').toLowerCase().includes(it)));
 render();msg(`조회결과 ${view.length}건입니다.`);}
/* v28: 수주 제번 풀(mold_code_match_pool)을 읽어 미확정 건까지 노출하고, 매칭 확정/해제를 DB에 반영 */
let sel=null;
const online=()=>!!(window.MESDB&&MESDB.online);
async function loadPool(){
 if(!online()&&window.MESDB&&MESDB.ready){try{await MESDB.ready}catch(e){}}
 if(!online()){msg('DB 미연결 — 사진 판독본을 표시합니다.');render();return}
 try{
  const rs=await MESDB.table('mold_code_match_pool').select('select=*&order=row_no');
  data.length=0;data.push(...rs);search();
  msg(`제번 ${data.length}건 (확정 ${rs.filter(r=>r.match_status==='확정').length} / 미확정 ${rs.filter(r=>r.match_status!=='확정').length})`);
 }catch(e){msg('조회 실패: '+String(e.message||e).slice(0,120));render()}
}
async function save(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(!online()){msg('DB 미연결 상태에서는 매칭을 확정할 수 없습니다.');return}
 try{
  let rowNo=sel.matched_row_no;
  if(rowNo==null){
   const mx=await MESDB.table('mold_code_matchings').select('select=row_no&order=row_no.desc&limit=1');
   rowNo=(mx&&mx[0]?Number(mx[0].row_no):0)+1;
  }
  await MESDB.table('mold_code_matchings').upsert({row_no:Number(rowNo),job_no:sel.job_no,
   quotation_no:sel.quotation_no,business_division_name:sel.business_division_name,
   mass_production_vendor_name:sel.mass_production_vendor_name,item_name:sel.item_name,
   order_type:sel.order_type,eco:sel.eco,model:sel.model,manager_name:sel.manager_name,
   customer_name:sel.customer_name,match_status:'확정',plant_name:sel.plant_name||'1공장'},'row_no');
  await loadPool();
  msg(`${sel.job_no} 금형코드 매칭을 확정했습니다.`);
 }catch(e){msg('저장 실패: '+String(e.message||e).slice(0,120))}
}
async function del_(){
 if(!sel){msg('제번을 선택하세요.');return}
 if(sel.matched_row_no==null){msg(`${sel.job_no} 은(는) 아직 매칭되지 않았습니다.`);return}
 if(!online()){msg('DB 미연결 상태에서는 매칭을 해제할 수 없습니다.');return}
 if(!confirm(`${sel.job_no} 의 금형코드 매칭을 해제하시겠습니까?`))return;
 try{await MESDB.table('mold_code_matchings').delete({row_no:Number(sel.matched_row_no)});
  const job=sel.job_no;sel=null;await loadPool();msg(`${job} 매칭을 해제했습니다.`);
 }catch(e){msg('해제 실패: '+String(e.message||e).slice(0,120))}
}
document.querySelectorAll('input[name="st"]').forEach(x=>x.addEventListener('change',search));
window.MES={search,save,setMessage:msg,reload:loadPool};render();</script><script src="mes_db.js?v=39"></script>
<script>loadPool();</script>
<script src="mes_ctx.js?v=39"></script>
</body></html>
