  const money=v=>Number(v||0).toLocaleString('ko-KR');

}

function search(){const k=document.querySelector('input[name="k"]:checked').value,j=q_job.value.trim().toLowerCase(),w=q_w.value.trim(),pc=q_p.value.trim().toLowerCase(),a=d1.value,b=d2.value;
