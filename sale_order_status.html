function renderTotal(){

  for(const r of view){const a=AMT[r.job_no];if(a){q+=Number(a.quotation_price)||0;o+=Number(a.order_price)||0;sl+=Number(a.sales_price)||0;n++}}

async function loadAmounts(){
  if(!window.MESDB)return;
  try{
    const rs=await MESDB.table('sale_orders').select('select=job_no,quotation_price,order_price,sales_price');
    AMT={}; rs.forEach(r=>AMT[r.job_no]=r); renderTotal();

function pick(i,tr){sel=i;document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel')}

 view=data.filter(r=>(st==='전체'||r.order_status===st)&&(ot==='전체'||r.order_type===ot)
  &&(!m||String(r.model??'').toLowerCase().includes(m))&&(!d||String(r.drawing_no??'').toLowerCase().includes(d))

  &&(!c||String(r.customer_name??'').toLowerCase().includes(c))&&(!mp||String(r.mass_production_vendor_name??'').toLowerCase().includes(mp)));
 render();message.textContent=`조회결과 ${view.length}건입니다.`;
}
function detail(admin){

}
async function delOrder(){
 if(sel<0){message.textContent='삭제할 수주를 목록에서 선택하세요.';return}
 const r=view[sel];
 if(!confirm(`${r.job_no} / ${r.item_name||''} 수주를 삭제할까요?\n(수주현황 목록 및 sale_orders에서 제거됩니다. 제번(jobs)은 유지)`))return;
 const idx=data.findIndex(x=>x.row_no===r.row_no);
 if(idx>=0)data.splice(idx,1);
 search();
 if(window.MESDB&&MESDB.online){
  try{
   if(!data.some(x=>x.job_no===r.job_no))await MESDB.table('sale_orders').delete({job_no:r.job_no});
   MESDB.syncMaster&&await MESDB.syncMaster();
   delete AMT[r.job_no];renderTotal();
  }catch(e){message.textContent='DB 삭제 실패: '+String(e.message||e).slice(0,120);return}
 }

}
function exportCsv(){

}
