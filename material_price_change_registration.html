:root{--line:#98a6b2;--line2:#c5d0d8;--blue:#2f75b5;--ink:#344757;--head1:#e8f1f8;--head2:#c8dbe9}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;font-size:12px;color:var(--ink);background:#fff;overflow:hidden}
button,input,select{font:inherit;color:inherit}.screen{height:100%;display:flex;flex-direction:column;background:#fff}
.title{height:48px;padding:8px 14px 5px;border-bottom:2px solid #3978ae;display:flex;align-items:center}.title h1{margin:0;font-size:22px;font-weight:500;color:#4b5c6a}.title h1:before{content:'◯';margin-right:6px;color:#8796a1}.title small{font-size:11px;color:#9ca7af;margin-left:12px}
.form{padding:7px 14px;background:#fafbfc;border-bottom:1px solid var(--line2)}.formrow{display:grid;grid-template-columns:78px 140px 78px 150px 90px 150px 90px minmax(160px,1fr);gap:5px;align-items:center}.formrow+.formrow{margin-top:5px}.label{font-weight:700}.field{height:27px;border:1px solid #b5c0c9;background:#fff;padding:0 6px;min-width:0}

.btn{height:29px;min-width:62px;border:1px solid #9ba8b4;background:linear-gradient(#fff,#dfe6eb);cursor:pointer}.btn:hover{background:#fff}
table{border-collapse:collapse;min-width:1040px;width:100%;table-layout:fixed}th,td{height:27px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}th{position:sticky;top:0;z-index:2;text-align:center;background:linear-gradient(var(--head1),var(--head2));color:#405266}tbody tr:nth-child(even) td{background:#fafcfd}tbody tr:hover td{background:#edf6fd}tbody tr.sel td{background:#2d75b7;color:#fff}.c{text-align:center}.num{text-align:right}.toolbar{height:40px;display:flex;align-items:center;gap:5px;padding:4px 14px;background:#f5f7f8;border-bottom:1px solid var(--line2)}

.split{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:10px;padding:0 14px 8px}.split .gridbox{margin:0}

</style></head><body><div class="screen">
<div class="title"><h1>자재단가변동 등록 <small>자재별 협력업체 단가와 적용시작일을 등록합니다.</small></h1></div>
<section class="form">
 <div class="formrow"><div class="label">등록일</div><input id="regDate" type="date" class="field" value="2026-08-22"><div class="label">담당자</div><input id="registrant" class="field" value="DG"><div class="label">구분</div><select id="kind" class="field"><option>원재료</option><option>구매품</option></select><div class="label">자재</div><input id="material" class="field"></div>

</section>
<div class="entrybox"><table><thead><tr><th style="width:180px">적용시작일</th><th style="width:150px">단가</th><th></th></tr></thead><tbody id="entryBody"><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr><tr><td></td><td class="num">0</td><td></td></tr></tbody></table></div>
<div class="toolbar"><button class="btn" onclick="save()">▣ 저장</button><button class="btn" onclick="remove()">✖ 삭제</button></div>
<div class="searchline"><input id="query" placeholder="검색어를 입력하세요."><button class="btn" onclick="search()">찾기</button><button class="btn" onclick="clearSearch()">지우기</button></div>
<div class="gridbox"><table><thead><tr><th>등록일</th><th>구분</th><th>자재코드</th><th>자재명</th><th>사이즈</th><th>협력업체코드</th><th>협력업체명</th><th>단가</th><th>담당자</th></tr></thead><tbody id="body"></tbody></table></div>
<footer class="foot"><button class="btn" onclick="window.parent?.closeActive?.()">⊠ 닫기</button><span class="msg" id="message">자재단가 데이터를 조회했습니다.</span><span class="right" id="countText"></span></footer>
</div><script>

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){body.innerHTML=view.map((r,i)=>`<tr onclick="selectRow(${i},this)"><td>${esc(r.registered_date||'')}</td><td>${esc(r.material_type)}</td><td>${esc(r.material_code)}</td><td>${esc(r.material_name)}</td><td class="c">${esc(r.size)}</td><td>${esc(r.vendor_code)}</td><td>${esc(r.vendor_name)}</td><td class="num">${Number(r.unit_price||0).toLocaleString()}</td><td>${esc(r.registered_by||r.manager_name||'')}</td></tr>`).join('');countText.textContent=`${view.length}건`}
function selectRow(i,tr){const r=view[i];document.querySelectorAll('#body tr').forEach(x=>x.classList.remove('sel'));tr.classList.add('sel');material.value=r.material_code;price.value=r.unit_price;size.value=r.size;vendor.value=r.vendor_code;effective.value=r.effective_date||'';message.textContent=`${r.material_code} / ${r.size} 단가를 선택했습니다.`}
function search(){const q=query.value.trim().toLowerCase();view=!q?[...data]:data.filter(r=>Object.values(r).some(v=>String(v??'').toLowerCase().includes(q)));render()}
function clearSearch(){query.value='';view=[...data];render()}
function save(){message.textContent='프로토타입 화면에 입력값을 반영했습니다. JSON 원본은 변경하지 않습니다.'}
function remove(){message.textContent='프로토타입에서는 원본 JSON 삭제를 수행하지 않습니다.'}
function exportCsv(){const h=['등록일','구분','자재코드','자재명','사이즈','협력업체코드','협력업체명','단가','담당자'];const rows=data.map(r=>[r.registered_date,r.material_type,r.material_code,r.material_name,r.size,r.vendor_code,r.vendor_name,r.unit_price,r.registered_by||r.manager_name]);download(h,rows,'material_price_changes.csv')}
function download(h,rows,n){const csv='\ufeff'+[h,...rows].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=n;a.click()}
window.MES={search,save,delete:remove,exportCsv,setMessage:t=>message.textContent=t};render();
